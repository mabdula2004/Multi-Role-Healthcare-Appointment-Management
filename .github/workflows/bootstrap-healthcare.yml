name: Bootstrap Medora Source
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-healthcare.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source archive
        run: |
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 | base64 -d > /tmp/healthcare-src.tgz
          tar -xzf /tmp/healthcare-src.tgz -C /tmp
          rsync -a /tmp/healthcare-react/ ./
      - name: Remove bootstrap staging files
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-healthcare.yml
      - name: Commit complete healthcare application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: build complete multi-role Medora healthcare platform'
          git push
